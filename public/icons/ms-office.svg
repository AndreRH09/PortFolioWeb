<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- MS Office icon: Microsoft branded O with app stack -->
  <defs>
    <linearGradient id="officeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#f7630c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#107c10;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#0078d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7030a0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main background -->
  <rect width="100" height="100" rx="20" fill="url(#officeGrad)"/>
  <!-- Office "O" shape with stacked apps visual -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
  <!-- Three mini document indicators -->
  <rect x="38" y="38" width="3" height="12" fill="white" opacity="0.7"/>
  <rect x="48" y="35" width="3" height="12" fill="white" opacity="0.8"/>
  <rect x="58" y="38" width="3" height="12" fill="white" opacity="0.7"/>
</svg>
