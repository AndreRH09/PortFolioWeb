<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- VS Code icon: blue background with chevrons -->
  <defs>
    <linearGradient id="vsCodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0063b1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#vsCodeGrad)"/>
  <!-- Chevrons symbol -->
  <g fill="white" opacity="0.9">
    <!-- Left chevron -->
    <polyline points="35,30 50,50 35,70" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right chevron -->
    <polyline points="50,30 65,50 50,70" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
